<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSX Demo - Using Babel in Browser</title>
    
    <!-- Load React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Load Babel Standalone to transpile JSX in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #root {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            min-width: 500px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-primary { background: #4299e1; color: white; }
        .btn-success { background: #48bb78; color: white; }
        .btn-danger { background: #e53e3e; color: white; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- 
        IMPORTANT: type="text/babel" tells Babel to transpile this code!
        This is how JSX works in the browser without a build step.
    -->
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // ============================================
        // NOW YOU CAN WRITE JSX! 🎉
        // ============================================
        
        function App() {
            const [count, setCount] = useState(0);
            const [name, setName] = useState('React');
            const [todos, setTodos] = useState(['Learn JSX', 'Build Apps']);
            
            useEffect(() => {
                console.log('Count changed:', count);
            }, [count]);
            
            // You can write HTML-like syntax directly!
            return (
                <div style={{ padding: '20px' }}>
                    <h1 style={{ color: '#2d3748' }}>JSX Demo 🚀</h1>
                    
                    {/* JavaScript expressions in curly braces */}
                    <h2>Count: {count}</h2>
                    <h3>Name: {name}</h3>
                    
                    {/* Event handlers - just like HTML! */}
                    <div>
                        <button 
                            className="btn-primary"
                            onClick={() => setCount(count + 1)}
                        >
                            Increment
                        </button>
                        
                        <button 
                            className="btn-primary"
                            onClick={() => setCount(count - 1)}
                        >
                            Decrement
                        </button>
                        
                        <button 
                            className="btn-danger"
                            onClick={() => setCount(0)}
                        >
                            Reset
                        </button>
                        
                        <button 
                            className="btn-success"
                            onClick={() => setName(name === 'React' ? 'JSX' : 'React')}
                        >
                            Toggle Name
                        </button>
                    </div>
                    
                    {/* Conditional Rendering */}
                    {count > 5 && (
                        <p style={{ color: 'green', fontWeight: 'bold' }}>
                            Count is greater than 5! 🎉
                        </p>
                    )}
                    
                    {count < 0 && (
                        <p style={{ color: 'red', fontWeight: 'bold' }}>
                            Count is negative! ⚠️
                        </p>
                    )}
                    
                    {/* Loops / Mapping over arrays */}
                    <div style={{ marginTop: '20px' }}>
                        <h4>Todo List:</h4>
                        <ul>
                            {todos.map((todo, index) => (
                                <li key={index}>{todo}</li>
                            ))}
                        </ul>
                    </div>
                    
                    {/* Nested components */}
                    <Card title="How JSX Works">
                        <p>1. You write HTML-like syntax in JavaScript</p>
                        <p>2. Babel transpiles it to React.createElement()</p>
                        <p>3. React creates Virtual DOM</p>
                        <p>4. React renders to Real DOM</p>
                    </Card>
                    
                    <InfoBox>
                        This is JSX! You can write HTML naturally with:
                        <ul>
                            <li>Variables in curly braces: {`{count}`}</li>
                            <li>Event handlers: onClick, onChange, etc.</li>
                            <li>Conditional rendering: {`{condition && <div>...</div>}`}</li>
                            <li>Loops: {`{array.map(item => <div>{item}</div>)}`}</li>
                        </ul>
                    </InfoBox>
                </div>
            );
        }
        
        // Reusable component
        function Card({ title, children }) {
            return (
                <div style={{
                    border: '2px solid #4299e1',
                    borderRadius: '8px',
                    padding: '15px',
                    marginTop: '20px',
                    backgroundColor: '#ebf8ff'
                }}>
                    <h4 style={{ color: '#2c5282', marginTop: 0 }}>{title}</h4>
                    {children}
                </div>
            );
        }
        
        function InfoBox({ children }) {
            return (
                <div style={{
                    backgroundColor: '#f7fafc',
                    border: '1px solid #e2e8f0',
                    borderRadius: '5px',
                    padding: '15px',
                    marginTop: '20px',
                    color: '#2d3748'
                }}>
                    {children}
                </div>
            );
        }
        
        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
